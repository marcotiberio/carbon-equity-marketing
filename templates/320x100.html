<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="ad.size" content="width=320,height=100">
  <title>Carbon Equity — 320x100</title>
  <script>var clickTag = "https://www.carbonequity.com/";</script>
  <script>window.CE = __CE_DATA__;</script>
  <style>
    @font-face{font-family:'Denim';font-style:normal;font-weight:500;font-display:block;
      src:url('fonts/DenimINKWD-Medium.subset.woff2') format('woff2')}

    :root{
      --plum:#491944; --plum-deep:#2e0f2b; --ink:#2e0f2b;
      --paper:#ffffff; --pink:#f0a19d; --pink-deep:#e88d89;
      --font:'Denim',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:320px;height:100px;overflow:hidden}

    .banner{
      position:relative;display:flex;
      width:320px;height:100px;
      background:var(--paper);
      font-family:var(--font);font-weight:500;color:var(--ink);
      text-decoration:none;overflow:hidden;cursor:pointer;
    }

    .hero{
      position:relative;flex:none;width:124px;height:100px;
      background:var(--pink);overflow:hidden;
      opacity:0;animation:fade .6s .05s ease forwards;
    }
    .hero__img{
      position:absolute;inset:0;
      background:url('hero.jpg') center / cover no-repeat;
    }
    .frame-lines{
      position:absolute;left:0;right:0;bottom:0;
      height:14px;z-index:5;
      background:url('contour-lines.png') center bottom / cover no-repeat;
      pointer-events:none;
    }

    .content{
      position:relative;flex:1;
      padding:11px 14px 14px;
    }

    .logo{
      position:absolute;top:11px;right:14px;
      opacity:0;animation:rise .5s .18s ease forwards;
    }
    .logo svg{display:block;height:15px;width:auto}

    .headline{
      position:absolute;left:14px;bottom:12px;
      font-weight:500;font-size:22px;line-height:.9;
      letter-spacing:-.015em;text-transform:uppercase;
      color:var(--plum-deep);
      opacity:0;animation:rise .55s .34s ease forwards;
    }

    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
<a class="banner" href="https://www.carbonequity.com/" target="_blank" rel="noopener"
   onclick="window.open(window.clickTag,'_blank');return false;">

  <div class="hero">
    <div class="hero__img"></div>
    <span class="frame-lines"></span>
  </div>

  <div class="content">
    <span class="logo">{{LOGO_DARK}}</span>

    <h1 class="headline"><span data-ce="headline.0"></span><br><span data-ce="headline.1"></span><br><span data-ce="headline.2"></span></h1>
  </div>
</a>
</body>
</html>
